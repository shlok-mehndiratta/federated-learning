[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-outage"
version = "0.1.0"
description = "When Can Federated Learning Survive Its Server? Isolation, Onset and Heterogeneity in Branch-and-Merge Recovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Anmol", email = "anmol@example.com" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "wandb>=0.16.0",
    "tqdm>=4.65.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fl_outage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:launch_testing_ros_pytest_entrypoint -p no:launch_testing -p no:launch_testing_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint -p no:colcon_core"
